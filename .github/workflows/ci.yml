name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: drive
          POSTGRES_PASSWORD: drive
          POSTGRES_DB: drive_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U drive" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://drive:drive@localhost:5432/drive_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - name: Tests on SQLite
        run: TEST_DB=sqlite go test ./app/routes/
      - run: CGO_ENABLED=0 go build -trimpath -o telegram-drive .

  # Servers download this binary instead of compiling: the Telegram client library
  # needs more than 3 GB of RAM to build, more than a small VPS has.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The binary carries the UI (webui, -tags embedui), built for the same origin as the API.
      - name: Build the UI
        run: |
          cd web && npm ci && VITE_API_URL= npm run build
          cp -r dist ../webui/dist
      - name: Build linux binaries
        run: |
          for arch in amd64 arm64; do
            f=telegram-drive-linux-$arch
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -tags embedui -trimpath -ldflags "-s -w" -o $f .
            sha256sum $f > $f.sha256
          done
          echo "$GITHUB_SHA" > commit.txt
      - name: Publish to the "edge" release
        run: |
          gh release view edge >/dev/null 2>&1 || gh release create edge --prerelease \
            --title "Latest main" --notes "Built automatically from the latest commit on main. Used by deploy/deploy.sh."
          gh release upload edge telegram-drive-linux-* commit.txt --clobber

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
